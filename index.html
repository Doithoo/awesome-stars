<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A searchable catalog of repositories starred by Doithoo.">
    <meta name="author" content="Doithoo">
    <meta name="theme-color" content="#f8f9fb">
    <title>Doithoo's Starred Repositories</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav container" aria-label="Primary navigation">
            <a class="brand-link" href="#catalog">DOITHOO / STARS</a>
            <a
                class="source-link"
                href="https://github.com/Doithoo/awesome-stars"
                aria-label="View source repository on GitHub"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7A5.4 5.4 0 0 0 19.22 4 5 5 0 0 0 19.13.5S17.95.14 15 1.84a13.38 13.38 0 0 0-7 0C5.05.14 3.87.5 3.87.5A5 5 0 0 0 3.78 4a5.4 5.4 0 0 0-1.5 3.5c0 5.42 3.44 6.66 6.72 7A4.8 4.8 0 0 0 8 18v4"/>
                    <path d="M9 18c-4.51 2-5-2-7-2"/>
                </svg>
            </a>
        </nav>
    </header>

    <main id="catalog" class="catalog">
        <section class="search-panel container" aria-labelledby="catalogTitle">
            <p class="eyebrow" id="collectionStats">Curated GitHub stars</p>
            <h1 id="catalogTitle">Doithoo's Starred Repositories</h1>
            <div class="search-field">
                <label for="searchInput">Search repositories</label>
                <div class="search-input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        autocomplete="off"
                        placeholder="Search by name, topic, owner, or language"
                    >
                </div>
            </div>
        </section>

        <section class="catalog-content container" aria-label="Repository catalog">
            <section class="toolbar" aria-label="Repository filters">
                <div class="filter-field">
                    <label for="languageFilter">Language</label>
                    <select id="languageFilter" class="filter-select">
                        <option value="">All languages</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="sortSelect">Sort</label>
                    <select id="sortSelect" class="filter-select">
                        <option value="recently-starred">Recently starred</option>
                        <option value="stars">Most stars</option>
                        <option value="updated">Recently updated</option>
                        <option value="name">Name</option>
                    </select>
                </div>
                <div id="quickFilters" class="quick-filters" role="group" aria-label="Popular languages"></div>
            </section>

            <p id="resultSummary" class="result-summary" aria-live="polite"></p>
            <section id="repositoryGrid" class="repository-grid" aria-label="Repositories"></section>
            <div class="load-more" hidden>
                <button id="loadMoreButton" type="button" hidden>Load more</button>
            </div>
            <div id="statusPanel" class="status-panel" aria-live="polite"></div>
        </section>
    </main>

    <footer id="footer" class="site-footer">
        <nav class="footer-links container" aria-label="Footer navigation">
            <a href="https://github.com/Doithoo" target="_blank" rel="noopener noreferrer">Doithoo</a>
            <a href="https://github.com/Doithoo/awesome-stars" target="_blank" rel="noopener noreferrer">Source</a>
            <a href="https://doithoo.github.io/awesome-stars/" target="_blank" rel="noopener noreferrer">Pages</a>
        </nav>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
